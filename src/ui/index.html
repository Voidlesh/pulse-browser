<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: crx:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Pulse</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="motion.css">
  <link rel="stylesheet" href="overlays.css">
</head>
<body>
  <header id="titlebar">
    <button id="logo" class="logo" title="Menü"><span>P</span></button>
    <div id="tabstrip"></div>
    <button id="new-tab" class="icon-btn" title="Neuer Tab (Strg+T)"></button>
    <div class="drag-space"></div>
    <div id="title-tools">
      <button class="icon-btn tt" id="tt-palette" title="Tabs &amp; Befehle durchsuchen (Strg+K)"></button>
      <button class="icon-btn tt" id="tt-snapshot" title="Snapshot (Strg+Umschalt+S)"></button>
      <button class="icon-btn tt" id="tt-easy" title="Design: Themes, Farben &amp; Effekte (Strg+Umschalt+E)"></button>
    </div>
    <div class="caption-space"></div>
  </header>

  <div id="toolbar">
    <button class="icon-btn" id="btn-back" title="Zurück (Alt+←)"></button>
    <button class="icon-btn" id="btn-forward" title="Vorwärts (Alt+→)"></button>
    <button class="icon-btn" id="btn-reload" title="Neu laden (F5)"></button>
    <button class="icon-btn" id="btn-home" title="Startseite"></button>
    <form id="address-form" autocomplete="off">
      <span id="site-icon"></span>
      <input id="address" spellcheck="false" placeholder="Suchen oder Adresse eingeben">
      <span id="zoom-badge" hidden></span>
      <button type="button" class="icon-btn small" id="btn-pip" title="Video als Bild-in-Bild" hidden></button>
      <button type="button" class="icon-btn small" id="btn-reader" title="Leseansicht (F9)"></button>
      <button type="button" class="icon-btn small" id="btn-note" title="Notiz zu dieser Seite"></button>
      <button type="button" class="icon-btn small" id="btn-bookmark" title="Lesezeichen (Strg+D)"></button>
    </form>
    <button class="icon-btn" id="btn-split" title="Split Screen beenden" hidden></button>
    <button id="focus-badge" title="Fokus-Modus läuft" hidden></button>
    <div id="adblock-badge" title="Blockierte Werbung &amp; Tracker auf dieser Seite"></div>
    <div id="ext-zone"><browser-action-list id="extension-actions" alignment="bottom right"></browser-action-list></div>
    <button class="icon-btn" id="btn-ext" hidden></button>
    <button class="icon-btn" id="btn-downloads" title="Downloads (Strg+J)"></button>
    <button class="icon-btn" id="btn-menu" title="Menü"></button>
    <div id="loadbar"></div>
  </div>

  <div id="infobar" hidden></div>
  <div id="updatebar" hidden></div>
  <div id="bookmarks-bar" hidden></div>
  <div id="findbar" hidden>
    <input id="find-input" placeholder="Auf Seite suchen" spellcheck="false">
    <span id="find-count"></span>
    <button class="icon-btn small" id="find-prev" title="Vorheriger"></button>
    <button class="icon-btn small" id="find-next" title="Nächster"></button>
    <button class="icon-btn small" id="find-close" title="Schließen (Esc)"></button>
  </div>

  <main id="body">
    <nav id="sidebar">
      <button class="side-btn" data-panel="control" title="Control: Limiter &amp; Cleaner"></button>
      <button class="side-btn" data-panel="focus" title="Fokus-Modus"></button>
      <div class="side-sep"></div>
      <div id="side-apps"></div>
      <button class="side-btn add" id="side-add" title="Web-App hinzufügen"></button>
      <div class="side-spacer"></div>
      <button class="side-btn" data-panel="bookmarks" title="Lesezeichen"></button>
      <button class="side-btn" data-panel="history" title="Verlauf"></button>
      <button class="side-btn" data-panel="downloads" title="Downloads"></button>
      <button class="side-btn" data-panel="notes" title="Notizen"></button>
      <button class="side-btn" data-panel="extensions" title="Erweiterungen"></button>
      <button class="side-btn" id="side-settings" title="Einstellungen (Alt+P)"></button>
    </nav>
    <section id="panel" hidden>
      <div id="panel-head"><h2 id="panel-title"></h2><div id="panel-tools"></div></div>
      <div id="panel-content"></div>
      <div id="webpanel-slot" hidden></div>
    </section>
    <div id="viewport">
      <div id="viewport-msg"></div>
      <div id="overlay" hidden>
        <img id="overlay-shot" alt="">
        <div id="overlay-scrim"></div>
        <div id="overlay-content"></div>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
