<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Neuer Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body class="anim-full">
  <div id="bg"></div>
  <canvas id="fx"></canvas>
  <main>
    <div id="clock"></div>
    <div id="date"></div>
    <form id="search-form" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" placeholder="Suchen oder Adresse eingeben" spellcheck="false" autofocus>
    </form>
    <section id="dial"></section>
    <form id="add-form" hidden>
      <input id="add-title" placeholder="Name">
      <input id="add-url" placeholder="https://…">
      <button type="submit">Hinzufügen</button>
      <button type="button" id="add-cancel">Abbrechen</button>
    </form>
  </main>
  <script type="module" src="newtab.js"></script>
</body>
</html>
